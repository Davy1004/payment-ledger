services:
  postgres:
    image: postgres:18
    container_name: payment-ledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
      POSTGRES_DB: payment_ledger
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d payment_ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:                      # `docker compose up --build` runs everything: DB + migrations + API
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger_user:ledger_password@postgres:5432/payment_ledger
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
    ports:
      - "8000:8000"

  worker:                   # delivers outbox events as signed webhooks; run more than one if you like
    build: .
    depends_on:
      - api                 # api applies the migrations on start
    command: ["uv", "run", "python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ledger_user:ledger_password@postgres:5432/payment_ledger
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}

volumes:
  postgres_data:
